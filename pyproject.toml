[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codevault"
version = "0.1.0"
description = "A local file history tracking tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "watchdog>=4.0.0"
]

[project.scripts]
codevault = "codevault.cli:main"
