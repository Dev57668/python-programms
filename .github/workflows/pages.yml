name: Deploy landing page

# Publishes codevault/web/static/landing.* to the gh-pages branch, which GitHub Pages serves.
# The dashboard needs the local Python server, so its links point to the setup section instead.
on:
  push:
    branches: [feature/backend]
    paths: ["codevault/web/static/landing.*", "scripts/build_landing.sh", "codevault/web/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: scripts/build_landing.sh site
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy landing page from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
